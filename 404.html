<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Página no encontrada | Manuel Molina</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="https://thepantera.github.io/mi-portfolio/favicon.png">
  <style>
    :root { --bg: #070b12; --panel: #0c1422; --line: #1c2b40; --muted: #8ba0b8; --text: #dbe7f3; --cyan: #22d3ee; --crit: #ef4444; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .term { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .bar { display: flex; gap: 6px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .bar i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .body { padding: 20px; font-size: 14px; line-height: 1.8; }
    .c { color: var(--cyan); } .e { color: var(--crit); } .m { color: var(--muted); }
    a.btn { display: inline-block; margin-top: 18px; padding: 10px 16px; border-radius: 8px; background: var(--cyan); color: #04121a; font-weight: 700; text-decoration: none; }
    a.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="term">
    <div class="bar"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i><span style="margin-left:8px">ops-console</span></div>
    <div class="body">
      <p><span class="c">$</span> curl -I <span id="path">/página</span></p>
      <p class="e">HTTP/2 404 · Not Found</p>
      <p class="m">La página que buscás no existe o cambió de lugar.<br>The page you are looking for does not exist.</p>
      <a class="btn" href="https://thepantera.github.io/mi-portfolio/">← Volver al portafolio</a>
    </div>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
